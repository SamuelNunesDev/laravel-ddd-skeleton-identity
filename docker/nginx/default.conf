server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws://localhost:5173 http://localhost:5173; font-src 'self'; img-src 'self' data:; script-src 'self' http://localhost:5173; style-src 'self' 'unsafe-inline' http://localhost:5173" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass app:9000;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
