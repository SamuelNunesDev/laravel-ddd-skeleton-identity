name: identity-platform

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  environment:
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_KEY: ${APP_KEY:-}
    APP_URL: ${APP_URL:-http://localhost:8080}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-identity}
    DB_USERNAME: ${DB_USERNAME:-identity}
    DB_PASSWORD: ${DB_PASSWORD:-change-me-local-app}
    PGCONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-3}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: nginx:1.28.3
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  worker:
    <<: *app
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    restart: unless-stopped

  scheduler:
    <<: *app
    command: php artisan schedule:work
    restart: unless-stopped

  node:
    image: node:24-bookworm-slim
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    profiles: ["dev"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  postgres:
    image: postgres:18.4-bookworm
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-identity_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-change-me-local-admin}
      POSTGRES_APP_USER: ${DB_USERNAME:-identity}
      POSTGRES_APP_PASSWORD: ${DB_PASSWORD:-change-me-local-app}
      POSTGRES_APP_DB: ${DB_DATABASE:-identity}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2.7-bookworm
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "127.0.0.1:8025:8025"

  e2e:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    working_dir: /app
    command: npx playwright test
    profiles: ["test"]
    environment:
      PLAYWRIGHT_BASE_URL: http://web
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      web:
        condition: service_started

volumes:
  node_modules:
  postgres_data:
  redis_data:
  vendor:
